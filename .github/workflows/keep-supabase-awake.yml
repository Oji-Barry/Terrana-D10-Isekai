# Visits the Supabase project every few days so the free plan never
# puts it to sleep for inactivity. It only reads one public username.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 15 */3 * *'   # every 3 days, around 10 AM Texas time
  workflow_dispatch:          # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visit the database
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            'https://cgkpksidyfrjjltfvhfp.supabase.co/rest/v1/profiles?select=username&limit=1' \
            -H 'apikey: sb_publishable_GjxEfXhnuhlubGY0JqMKEw_jpqdJgsi')
          echo "Supabase answered with $code"
          test "$code" = "200"
